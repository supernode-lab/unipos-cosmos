[workspace]
members = ["contracts/*", "packages/*"]
resolver = "2"


[workspace.dependencies]
cosmwasm-schema = "2.2.2"
cosmwasm-std = { version = "2.2.2" }
cw-storage-plus = { version = "2.0.0", default-features = false, features = ["iterator"] }
serde = { version = "1.0.197", default-features = false, features = ["derive"] }
thiserror = { version = "2.0.16" }
cw20 = { version = "2.0.0", package = "cw20" }
bh-storage = { path = "packages/bh-storage" }
unipos = { path = "packages/unipos" }
universal-token = { path = "packages/universal-token" }
access-control = { path = "packages/access-control" }
stakecore = { path = "contracts/stakecore" }
[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = 'abort'
incremental = false
overflow-checks = true


